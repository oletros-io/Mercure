# pyproject.toml
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mercure"
version = "1.0.0"
description = "Domain security auditor - SPF, DKIM, DMARC, CAA, DNSSEC and more"
requires-python = ">=3.10"
dependencies = [
  "dnspython>=2.6.1",
  "ipwhois>=1.2.0",
  "rich>=13.0.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
]

[project.scripts]
mercure = "cli:main"
